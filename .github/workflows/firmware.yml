name: Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'firmware/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-build.txt'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/firmware.yml'
  pull_request:
    branches: [main]
    paths:
      - 'firmware/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements-build.txt'
      - 'THIRD_PARTY_NOTICES.md'
      - '.github/workflows/firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  build:
    name: Build and verify CYD firmware
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install build dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-build.txt

      - name: Build firmware
        run: .venv/bin/python scripts/pio.py run -d firmware -e cyd

      - name: Test portable firmware and packaging tools
        run: |
          .venv/bin/python scripts/test_firmware.py
          .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Package and validate firmware
        run: .venv/bin/python scripts/package_firmware.py

      - name: Prepare release files and checksums
        run: |
          .venv/bin/python - <<'PY'
          import hashlib
          import json
          import os
          import zipfile
          from pathlib import Path

          root = Path('artifacts')
          manifest = json.loads((root / 'desk-duo-cyd.json').read_text())
          app = (root / 'desk-duo-app.bin').read_bytes()
          version = app[48:80].split(b'\0', 1)[0].decode('ascii')
          if manifest['sourceDirty']:
              raise SystemExit('Build changed tracked source; refusing to publish')
          if manifest['gitCommit'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Build commit does not match workflow commit')
          if os.environ['GITHUB_REF_TYPE'] == 'tag' and os.environ['GITHUB_REF_NAME'] != 'v' + version:
              raise SystemExit('Release tag must match the application version: v' + version)
          with zipfile.ZipFile(root / 'notices.zip', 'w', zipfile.ZIP_DEFLATED) as archive:
              for notice in sorted((root / 'notices').iterdir()):
                  archive.write(notice, 'notices/' + notice.name)
          files = sorted(path for path in root.iterdir() if path.is_file())
          (root / 'SHA256SUMS').write_text(''.join(
              hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + path.name + '\n'
              for path in files))
          notes = (
              '# Desk Duo ' + version + '\n\n'
              'Built from commit `' + manifest['gitCommit'] + '`.\n\n'
              '- **Wi-Fi OTA:** upload `desk-duo-app.bin` in the device web admin.\n'
              '- **Initial USB installation:** `desk-duo-cyd.bin` is the merged image. '
              'Do not write it over a configured device; it can erase settings.\n'
              '- **Existing factory-layout boards:** use the segmented migration tool '
              'and the bootloader, partition table, OTA initialization, and app files.\n'
              '- Check `SHA256SUMS` and `desk-duo-cyd.json` before flashing. '
              'Third-party licenses are included in `notices.zip`.\n\n'
              'See the [firmware guide](https://github.com/' + os.environ['GITHUB_REPOSITORY']
              + '/blob/' + os.environ['GITHUB_SHA'] + '/firmware/README.md) for installation details.\n')
          (root / 'RELEASE_NOTES.md').write_text(notes)
          PY

      - name: Upload verified firmware package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desk-duo-cyd-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download verified firmware package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: desk-duo-cyd-${{ github.sha }}
          path: release-files

      - name: Verify downloaded files
        working-directory: release-files
        run: sha256sum --check SHA256SUMS

      - name: Publish release and firmware assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            --verify-tag \
            --title "Desk Duo $RELEASE_TAG" \
            --notes-file release-files/RELEASE_NOTES.md \
            release-files/desk-duo-app.bin \
            release-files/desk-duo-cyd.bin \
            release-files/bootloader.bin \
            release-files/partitions.bin \
            release-files/ota_data_initial.bin \
            release-files/desk-duo-cyd.json \
            release-files/desk-duo-cyd.sha256 \
            release-files/SHA256SUMS \
            release-files/notices.zip
